server:
  port: 8080

spring:
  application:
    name: ims
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/ims
    username: ims
    password: ims
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

mybatis:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.ims.**.entity
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ims-secret-key-for-jwt-token-generation-2024
  expiration: 86400000

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    com.ims: DEBUG
